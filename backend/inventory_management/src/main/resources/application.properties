spring.application.name=inventory_management
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server port
server.address=0.0.0.0

server.port=3700



# CORS Configuration for React Frontend
web.cors.allowed-origins=http://192.168.1.100:3000
# JWT Settings
jwt.secret=a-very-long-and-secure-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expirationMs=8640000 
  # 24 hours
